name: Generate 3D Components & Publish

on:
  workflow_dispatch:
    inputs:
      design_system:
        description: 'Target UI Style'
        required: true
        default: 'Liquid Glass 01'
        type: choice
        options:
          - 'Liquid Glass 01'
          - 'Crystal Quartz 02'
          - 'Brushed Titanium 03'
          - 'Aurora Plasma 04'
          - 'Holographic HUD 05'
      generation_mode:
        description: 'Mode'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'missing'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 3. Re-index Catalog & Build Website
        run: |
          node scripts/generate-catalog.js
          node scripts/build-website.js

      - name: 4. Commit New Generated Files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add components/ website/ catalog.json || true
          if git diff --staged --quiet; then
            echo "No file changes to commit."
          else
            git commit -m "chore: update catalog and website distribution [skip ci]"
            git push origin main
          fi

      - name: 5. Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'website/dist'

  deploy-pages:
    needs: generate-and-publish
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 6. Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        
